server {
  # Cloud Run always sends traffic to $PORT, which defaults to 8080.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The console is a single-page app with 14 real paths. A deep link to
  # /tindakan must serve index.html, not 404 — otherwise a shared link to a
  # draft or a ticket is broken on arrival.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles are immutable; index.html must never be cached, or a deploy
  # leaves browsers pointing at asset names that no longer exist.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Static console, no inline scripts of its own: the policy can stay tight.
  # Google Fonts is allowed because design/tokens.css imports Barlow from it.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.run.app; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cloud Run's health check needs something cheap that is not the SPA.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
