name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request only needs to read the repository. Nothing here deploys.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  TERRAFORM_VERSION: '1.9.8'

jobs:
  node:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        # Thresholds live in each workspace's vitest config, so a coverage drop
        # fails here rather than being reported and ignored.
        run: npm run test:coverage

      - name: Build every workspace that has a build
        run: npm run build

  eval:
    name: Agent eval thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # Constitution quality gate: the eval suite must pass its thresholds
      # before a deploy. The runner exits non-zero when any gate fails, so this
      # blocks the merge rather than printing a number nobody reads.
      - name: Run the golden set
        run: node eval/run_eval.mjs --report eval-report.json

      # Uploaded on failure too — the report names the cases that failed, which
      # is the thing you actually need when the gate goes red.
      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: error

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # No credentials and no state: validation is a type and syntax check, and
      # a pull request must never be able to touch real infrastructure.
      - name: Init without backend
        run: terraform init -backend=false -input=false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate -no-color

  # One real call, so "the reasoning layer is wired" is a claim CI checks rather
  # than a claim the README makes. Kept out of the eval job on purpose: the
  # eval's thresholds must be reproducible and free, and a live model is
  # neither — a rate limit should degrade this job, not invalidate the gates.
  live-model:
    name: Live model smoke
    runs-on: ubuntu-latest
    env:
      # From a repository secret, never from the repo. The `secrets` job below
      # exists to keep it that way.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOKUS_REASONING: apikey
      GOOGLE_CLOUD_PROJECT: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Skipped rather than failed when the secret is absent, so a fork — which
      # cannot read it — still gets a green CI instead of a red one it has no
      # way to fix.
      - name: Install
        if: env.GEMINI_API_KEY != ''
        run: npm ci

      - name: Ask the model one question
        if: env.GEMINI_API_KEY != ''
        run: node scripts/smoke-model.mjs

      - name: Say why nothing ran
        if: env.GEMINI_API_KEY == ''
        run: echo "::notice::GEMINI_API_KEY tidak tersedia — smoke model dilewati."

  secrets:
    name: No secrets in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Constitution quality gate: Secret Manager only. This catches the two
      # ways a credential usually arrives — a committed env file or a committed
      # tfvars/state file. `git ls-files` is used so only tracked files count.
      - name: Reject committed credential files
        run: |
          tracked=$(git ls-files \
            '*.env' '.env' '.env.*' \
            'terraform.tfvars' '*.auto.tfvars' \
            '*.tfstate' '*.tfstate.*' \
            'backend.hcl' \
            '*service-account*.json' \
            | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::These files must never be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "No credential files tracked."
